name: Vendo AI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendo_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendo_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run database migrations
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vendo_ai
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/vendo_ai

      - name: Seed database
        run: |
          python scripts/generate_business_data.py
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vendo_ai
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/vendo_ai

      - name: Run linting (ruff)
        run: |
          ruff check apps/api tests

      - name: Run backend tests
        run: |
          python -m pytest tests/backend/test_core_logic.py -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vendo_ai
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/vendo_ai

      - name: Validate data integrity
        run: |
          python scripts/validate_data.py
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vendo_ai
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/vendo_ai

  frontend-tests:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run linting
        run: |
          cd apps/web
          npm run lint

      - name: Build Next.js
        run: |
          cd apps/web
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  integration-test:
    name: Integration Test (Full Stack)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendo_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendo_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps
        run: |
          uv pip install --system -e ".[dev]"

      - name: Install frontend deps
        run: |
          cd apps/web
          npm ci

      - name: Run migrations
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vendo_ai
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/vendo_ai

      - name: Seed demo data
        run: |
          python scripts/generate_business_data.py
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vendo_ai
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/vendo_ai

      - name: Start backend
        run: |
          uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vendo_ai
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/vendo_ai
          REDIS_URL: redis://localhost:6379/0
          AI_PROVIDER: mock
          DEMO_MODE: "true"

      - name: Test health endpoint
        run: curl -f http://localhost:8000/health

      - name: Test demo endpoint
        run: |
          LOGIN_RES=$(curl -s -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"demo@vendo.ai","password":"password123"}')
          TOKEN=$(echo $LOGIN_RES | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
          curl -f -s -X POST http://localhost:8000/api/demo/run \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set in repository settings."
            echo "Frontend is configured for direct Vercel Git integration."
            exit 0
          fi
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t vendo-ai-backend:latest -f apps/api/Dockerfile .

      - name: Trigger deployment webhook
        env:
          DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "BACKEND_DEPLOY_HOOK secret is not set in repository settings."
            echo "Docker build succeeded. Service can be linked to Render/Railway."
            exit 0
          fi
          curl -X POST "$DEPLOY_HOOK"