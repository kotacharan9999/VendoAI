<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendo AI — Redirecting to Live App</title>
  <meta http-equiv="refresh" content="0; url=https://vendo-ai-web.vercel.app/login">
  <link rel="canonical" href="https://vendo-ai-web.vercel.app/login">
  <script>
    window.location.replace("https://vendo-ai-web.vercel.app/login");
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      padding: 1.5rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 3.5rem;
      height: 3.5rem;
      background: #2563eb;
      color: #fff;
      font-weight: 800;
      font-size: 1.75rem;
      border-radius: 0.875rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }
    .spinner {
      display: inline-block;
      width: 1.75rem;
      height: 1.75rem;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      padding: 0.75rem 1.25rem;
      border-radius: 0.625rem;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
    }
    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .sublink {
      display: block;
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #64748b;
      text-decoration: none;
    }
    .sublink:hover {
      color: #94a3b8;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">V</div>
    <div class="spinner"></div>
    <h1>Redirecting to Vendo AI</h1>
    <p>Taking you directly to the live platform...</p>
    <a class="btn" href="https://vendo-ai-web.vercel.app/login">
      Open Vendo AI App &rarr;
    </a>
    <a class="sublink" href="https://vendo-ai-web.vercel.app/dashboard">Direct link to Dashboard</a>
  </div>
</body>
</html>
